<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="create-dpas-app">
  <!-- The two planes: view (browser, violet) above, domain (server, blue) below.
       Flat mid-tones so one file reads on light and dark backgrounds. -->
  <path d="M16 2.5 29 9.5 16 16.5 3 9.5Z" fill="#8b5cf6" fill-opacity="0.22" stroke="#8b5cf6" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M16 15.5 29 22.5 16 29.5 3 22.5Z" fill="#3b82f6" fill-opacity="0.26" stroke="#3b82f6" stroke-width="1.8" stroke-linejoin="round" />

  <!-- One catalog through both. -->
  <circle cx="16" cy="9.5" r="2" fill="#8b5cf6" />
  <circle cx="16" cy="22.5" r="2" fill="#3b82f6" />
</svg>
