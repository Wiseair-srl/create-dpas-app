name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Example drift gate
        run: pnpm check:example
      - name: Docs site (fails on dead links)
        if: matrix.node == 22
        run: pnpm docs:build

  e2e:
    name: template e2e (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dpas-template-default exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: templates/default/playwright-report
          retention-days: 7

  scaffold-smoke:
    name: generated-project smoke (pm ${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [pnpm, npm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke (pnpm end-to-end)
        if: matrix.pm == 'pnpm'
        run: pnpm test:scaffold
      - name: Smoke (npm install of generated app)
        if: matrix.pm == 'npm'
        run: |
          pnpm --filter create-dpas-app build
          mkdir -p /tmp/npm-smoke && cd /tmp/npm-smoke
          node "$GITHUB_WORKSPACE/packages/create-dpas-app/dist/index.js" npm-app --yes --package-manager npm --no-install --no-git
          cd npm-app
          npm install
          npm run typecheck
          npm run build
